name: Python tests
on:
  push:
    paths:
      - 'zte_manager/**'
      - 'tests/**'
      - 'tools/**'
      - 'package*.json'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'zte_manager/**'
      - 'tests/**'
      - 'tools/**'
      - 'package*.json'
      - '.github/workflows/tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python tools/run_tests.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: JavaScript syntax and simulator tests
        run: |
          node --check zte_manager/src/static/app.js
          node --check zte_manager/src/static/wifi-view.js
          node --check zte_manager/src/static/studio.js
          node --check zte_manager/src/static/dev-model.js
          node --check zte_manager/src/static/preview.js
          node --check zte_manager/src/static/wifi-draft.js
          node --check zte_manager/src/static/network-insights.js
          node --test tests/*.cjs
